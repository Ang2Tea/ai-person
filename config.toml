[llm]
model = "deepseek/deepseek-v4-flash"
embedding_model = "openai/text-embedding-3-small"

[personality]
path = "personalities/default"

[personality.files]
system_prompt = "system_prompt.md"
working_memory = "working_memory.json"
diary_dir = "diary"
insights = "insights.md"

[memory]
token_threshold = 40000
dedup_similarity_threshold = 0.92
auto_retrieval_similarity_threshold = 0.5
auto_retrieval_limit = 2
min_fact_length = 20
keep_last_messages = 5
stale_after_days = 60
idle_extraction_after_minutes = 30

[proactive]
interval_minutes = 90
probability = 0.5
min_inactivity_minutes = 90
