name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Пока репозиторий приватный, отключено ради экономии Action minutes (бесплатно 2000/мес).
  # Вернуть: раскомментировать джобу и `needs: test` в build ниже.
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         components: clippy
  #
  #     - uses: Swatinem/rust-cache@v2
  #
  #     - name: Test
  #       run: cargo test --workspace
  #
  #     - name: Clippy
  #       run: cargo clippy --all-targets -- -D warnings

  build:
    # needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl cross tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-bot-strict-messaging

      - name: Build bot (release, musl, strict-messaging)
        run: >
          cargo build --release
          --target x86_64-unknown-linux-musl
          --features strict-messaging
          -p app --bin bot

      - name: Stage binary for upload
        run: mv target/x86_64-unknown-linux-musl/release/bot target/x86_64-unknown-linux-musl/release/bot.new

      - uses: actions/upload-artifact@v4
        with:
          name: bot-binary
          path: target/x86_64-unknown-linux-musl/release/bot.new
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bot-binary

      - name: Upload staged binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "bot.new"
          target: "/root/ai-person-release/"

      - name: Activate binary and restart instances
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/ai-person-release
            chmod +x bot.new
            [ -f bot ] && cp -p bot bot.prev
            mv bot.new bot
            ./deploy-restart.sh
