[workspace]
resolver = "3"
members = [
    "contracts",
    "bot-core",
    "adapters/llm/*",
    "adapters/storages/*",
    "adapters/channels/*",
    "app",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

# Внутренние крейты — по имени пакета, не по пути, чтобы члены workspace
# могли ссылаться друг на друга через `<crate> = { workspace = true }`.
bot-core = { path = "bot-core" }
contracts = { path = "contracts" }
llm-timeweb = { path = "adapters/llm/timeweb" }
storage-fs = { path = "adapters/storages/fs" }
channel-telegram-bot = { path = "adapters/channels/telegram-bot" }
